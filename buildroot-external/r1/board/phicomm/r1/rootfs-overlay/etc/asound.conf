# The A24 machine driver exposes only the RK_AK7755 card during initial
# validation.  Keep conversion in userspace: the AK7755 contract is fixed at
# 48 kHz, stereo, S16_LE while an A2DP source may provide 44.1 kHz PCM.
pcm.r1-output {
	type plug
	slave {
		pcm "hw:0,0"
		format S16_LE
		rate 48000
		channels 2
	}
}

pcm.!default pcm.r1-output

ctl.!default {
	type hw
	card 0
}
