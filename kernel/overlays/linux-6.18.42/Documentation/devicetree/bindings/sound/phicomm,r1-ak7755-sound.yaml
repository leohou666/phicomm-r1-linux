%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/phicomm,r1-ak7755-sound.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Phicomm R1 AK7755 sound card

maintainers:
  - Phicomm R1 Linux contributors

description: |
  Minimal machine link between the RK3229 I2S2 controller and the AK7755 on
  the Phicomm R1. The CPU provides BCLK and LRCK. The first implementation is
  deliberately restricted to 48 kHz, stereo, 16-bit PCM and does not control
  the external amplifier.

properties:
  compatible:
    const: phicomm,r1-ak7755-sound

  phicomm,cpu-dai:
    $ref: /schemas/types.yaml#/definitions/phandle

  phicomm,audio-codec:
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - phicomm,cpu-dai
  - phicomm,audio-codec

additionalProperties: false

examples:
  - |
    sound {
        compatible = "phicomm,r1-ak7755-sound";
        phicomm,cpu-dai = <&i2s2>;
        phicomm,audio-codec = <&ak7755>;
    };
...
